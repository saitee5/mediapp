version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - mediscribe

  mediscribe:
    build:
      context: ./mediscribe
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./mediscribe/.env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}

